apiVersion: v1
kind: Pod
metadata:
  name: nginx-node-anti-affinity
  labels:
    env: test
spec:
  affinity:
    nodeAffinity:
      #hard rule
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: NotIn
            values:
            - us-east-1b
          - key: project
            operator: In
            values:
            - roboshop     
  containers:
  - name: nginx
    image: nginx
  tolerations:
  - key: "project"  
    operator: "Equal"
    value: "roboshop"
    effect: "NoExecute"