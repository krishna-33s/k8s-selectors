apiVersion: v1
kind: Pod
metadata:
  name: nginx-nodeaffinity
  labels:
    env: test
spec:
  affinity:
    nodeAffinity:
      #hard rule
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: In
            values:
            - us-east
            - us-east-1b
  containers:
  - name: nginx
    image: nginx
  