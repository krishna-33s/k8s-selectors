apiVersion: v1
kind: Pod
metadata:
  name: nginx-tolerated
  labels:
    env: test
spec:
  containers:
  - name: nginx
    image: nginx
  # if this label is matches with node labels then this pod will move to inside the label matches node  
  nodeSelector:
    project: flipkart
  tolerations:
  - key: "project"
    operator: "Equal"
    value: "flipkart"
    effect: "NoSchedule"
